apiVersion: v1
kind: Service
metadata:
  name: echotalk-frontend
  labels:
    app: echotalk-frontend
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30180
  selector:
    app: echotalk-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echotalk-frontend
  labels:
    app: echotalk-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echotalk-frontend
  template:
    metadata:
      labels:
        app: echotalk-frontend
    spec:
      containers:
        - name: frontend
          image: echotalk-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: echotalk-frontend-nginx
